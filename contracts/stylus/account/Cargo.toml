[package]
name = "verakey-account"
description = "VeraKey smart account: ZK-verified passkey authorization with an on-chain USDG spending policy."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
stylus-sdk.workspace = true
openzeppelin-stylus.workspace = true
ruint.workspace = true
verakey-core.workspace = true

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi", "openzeppelin-stylus/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "verakey-account"
path = "src/main.rs"
